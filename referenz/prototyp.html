<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#14151A; --ink2:#41454D; --muted:#8C9199; --line:#F0F0F3; --surface:#FFFFFF;
  --pos:#3BA55C; --neg:#E0524F;
  --t-mint:#E6F4E9; --t-yellow:#FCF3D5; --t-lav:#EDEAFA; --t-blue:#E7F0FD; --t-rose:#FBEAEF;
  --bar1:#FDEDA8; --bar2:#F6CE45;
  --r:20px; --r-sm:14px; --r-xs:10px;
  --sh:0 1px 2px rgba(20,20,30,.04), 0 10px 28px rgba(20,20,30,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  color:var(--ink); font-family:"Plus Jakarta Sans","Noto Sans Arabic",system-ui,sans-serif;
  font-size:14px; line-height:1.5; min-height:100vh;
  background:
    radial-gradient(1100px 620px at 0% -5%, #FAE4EA 0%, rgba(250,228,234,0) 58%),
    radial-gradient(950px 700px at 105% 105%, #E6F3E9 0%, rgba(230,243,233,0) 62%),
    #FDFAF5;
  background-attachment:fixed;
}
[dir=rtl] body{font-family:"Noto Sans Arabic","Plus Jakarta Sans",system-ui,sans-serif}
.num,td.num,th.num,.val{font-variant-numeric:tabular-nums}
h1{font-size:25px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:17px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:14.5px;font-weight:700;margin:0 0 14px}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

.app{display:flex;gap:18px;padding:18px;max-width:1580px;margin:0 auto}
aside{width:238px;flex:0 0 238px;background:var(--surface);border-radius:26px;box-shadow:var(--sh);
  padding:22px 14px 18px;position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800;padding:0 10px 4px;letter-spacing:-.02em}
.brand b{width:26px;height:26px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.mand{margin:14px 6px 16px}
.mand select{border-radius:12px;background:#F7F7F9;border:0;font-weight:600;font-size:12.5px;padding:9px 10px}
nav{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:start;background:none;border:0;
  padding:10px 13px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink2);
  font-size:13.5px;font-weight:600;font-family:inherit;margin-bottom:2px}
.navbtn:hover{background:#F6F6F8}
.navbtn.on{background:var(--ink);color:#fff;box-shadow:0 6px 16px rgba(20,20,30,.18)}
.navbtn .k{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--muted)}
.navbtn.on .k{color:rgba(255,255,255,.6)}
.navsep{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#B9BDC5;font-weight:700;padding:15px 13px 7px}
main{flex:1;min-width:0;padding:4px 6px 50px}

.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 20px}
.topbar .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:9px 16px;box-shadow:var(--sh);min-width:210px;color:var(--muted)}
.search input{border:0;background:none;padding:0;outline:none;font-size:13px;width:100%}
.pillbox{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:5px 7px;box-shadow:var(--sh)}
.pillbox input[type=month]{border:0;background:none;padding:4px 4px;width:132px;font-weight:600;font-size:13px}
.iconbtn{width:36px;height:36px;border-radius:999px;border:0;background:var(--surface);box-shadow:var(--sh);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);position:relative}
.iconbtn:hover{background:#F6F6F8}
.who{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:var(--sh)}
.who .av{width:30px;height:30px;border-radius:999px;background:var(--t-lav);color:#5A52A6;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.who .n{font-size:12.5px;font-weight:700;line-height:1.2}
.who .r{font-size:10.5px;color:var(--muted)}

.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.tile{border-radius:var(--r-sm);padding:14px 15px;position:relative;cursor:pointer;border:0;text-align:start;width:100%;font-family:inherit}
.tile .tt{font-size:13px;font-weight:700;margin-bottom:3px;padding-inline-end:18px}
.tile .ts{font-size:11px;color:#6C717A;line-height:1.35}
.tile .ar{position:absolute;top:12px;inset-inline-end:13px;color:#6C717A}
.tile:hover{filter:brightness(.98)}

.kpiwrap{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:6px;overflow:hidden}
.kpi{padding:17px 19px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi .lbl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.03em}
.kpi .dlt{font-size:11.5px;font-weight:600;margin-top:7px;color:var(--muted);display:flex;align-items:center;gap:4px}
.kpi:nth-child(3n){border-inline-end:0}
.kpi:nth-last-child(-n+3){border-bottom:0}
.pos{color:var(--pos)} .neg{color:var(--neg)}

button,select,input,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
input,select,textarea{background:#FBFBFC;border:1px solid var(--line);border-radius:var(--r-xs);padding:10px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #D8D8E0;outline-offset:-1px;background:#fff}
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;
  font-weight:600;font-size:13px;width:auto;white-space:nowrap;box-shadow:0 6px 16px rgba(20,20,30,.16);
  display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#000}
.btn.ghost{background:var(--surface);color:var(--ink2);box-shadow:var(--sh)}
.btn.ghost:hover{background:#F6F6F8}
.btn.sm{padding:7px 13px;font-size:12px;box-shadow:none}
.btn.danger{background:#FCEBEB;color:var(--neg);box-shadow:none}
.btn.wide{width:100%;justify-content:center}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:130px}
.row>.fit{flex:0 0 auto;min-width:0}
.seg{display:inline-flex;background:#F4F4F6;border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 15px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;font-size:11.5px;color:var(--muted);font-weight:600;padding:0 10px 10px}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:end}
tbody tr:hover td{background:#FAFAFC}
.tw{overflow-x:auto}
.tag{display:inline-block;font-size:11px;font-weight:700;background:#F4F4F6;border-radius:7px;padding:2px 7px;color:var(--ink2)}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:4px 11px}
.pill.g{background:var(--t-mint);color:#2C7A44} .pill.y{background:var(--t-yellow);color:#8A6A12}
.pill.b{background:var(--t-blue);color:#2A5CA5} .pill.r{background:var(--t-rose);color:#A33B58}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.note{background:var(--t-yellow);border-radius:var(--r-sm);padding:13px 16px;font-size:12.5px;color:#6B5716}
.listrow{display:flex;align-items:center;gap:11px;padding:10px 0}
.listrow+.listrow{border-top:1px solid var(--line)}
.av2{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#41454D}
.listrow .n{font-size:12.5px;font-weight:600;line-height:1.25}
.listrow .s{font-size:11px;color:var(--muted)}
.listrow .v{margin-inline-start:auto;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:7px;border-radius:999px;background:#F1F1F4;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--bar1),var(--bar2))}
.chart{display:flex;align-items:flex-end;gap:7px;height:196px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;height:100%}
.chart .b{width:72%;max-width:32px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--bar1),var(--bar2));min-height:3px}
.chart .c:hover .b{background:linear-gradient(180deg,#F6CE45,#E5B41C)}
.chart .l{font-size:10.5px;color:var(--muted);font-weight:600}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:196px;padding-top:10px;font-size:10.5px;color:var(--muted);font-weight:600;text-align:end;flex:0 0 auto}

.mask{position:fixed;inset:0;background:rgba(20,22,28,.36);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:24px;padding:24px;width:100%;max-width:580px;box-shadow:0 24px 60px rgba(20,20,30,.2)}
.modal.wide{max-width:880px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.x{background:#F4F4F6;border:0;cursor:pointer;color:var(--ink2);width:32px;height:32px;border-radius:999px;padding:0;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.logobox{border:1px dashed #DEDEE4;border-radius:var(--r-sm);padding:16px;text-align:center;background:#FBFBFC}
.logobox img{max-height:76px;max-width:220px;object-fit:contain}
.soon{display:flex;flex-direction:column;align-items:center;gap:14px;padding:46px 20px;text-align:center}
.soon .ph{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A6A12;background:var(--t-yellow);border-radius:999px;padding:5px 13px}

@media(max-width:1100px){.dash{grid-template-columns:1fr}}
@media(max-width:900px){
  .app{flex-direction:column;padding:12px;gap:12px}
  aside{width:100%;flex:none;height:auto;position:static;border-radius:20px}
  nav{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
  .navsep{grid-column:1/-1;padding-top:10px}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}
  .kpi{border-inline-end:0}
  .kpi:nth-last-child(-n+3){border-bottom:0}
  main{padding:0}
  h1{font-size:21px}
  .search{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

const kurz=n=>{n=Number(n)||0; return Math.abs(n)>=1000? Math.round(n/1000)+'k' : Math.round(n)};

function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function num(v){ if(typeof v==='number')return v; if(!v)return 0;
  let s=String(v).replace(/[^\d,.\-]/g,'');
  if(s.includes(',')&&s.includes('.')) s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else s=s.replace(',','.');
  return parseFloat(s)||0; }
const konto=nr=>M().konten.find(k=>k.nr===String(nr));
const inP=(d,p)=>(d||'').slice(0,7)===p;
function prevP(p){const[y,m]=p.split('-').map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function bList(p){return M().buchungen.filter(b=>inP(b.datum,p)).sort((a,b)=>a.datum.localeCompare(b.datum))}
function split(b){const br=Number(b.betrag)||0,s=M().s.klein?0:(Number(b.ust)||0);const n=br/(1+s/100);return{brutto:br,netto:n,steuer:br-n,satz:s}}
function calc(list){
  const r={ein:0,einB:0,ust:0,aus:0,ausB:0,vst:0,proKonto:{}};
  list.forEach(b=>{const k=konto(b.konto); if(!k)return; const s=split(b);
    r.proKonto[b.konto]=r.proKonto[b.konto]||{netto:0,n:0}; r.proKonto[b.konto].netto+=s.netto; r.proKonto[b.konto].n++;
    if(k.typ==='erloes'){r.ein+=s.netto;r.einB+=s.brutto;r.ust+=s.steuer}
    else if(k.typ==='aufwand'){r.aus+=s.netto;r.ausB+=s.brutto;r.vst+=s.steuer}});
  r.erg=r.ein-r.aus; r.zahl=r.ust-r.vst; return r;
}
function kassenstand(bis){ let s=Number(M().s.kassenAnfang)||0;
  M().buchungen.filter(b=>b.gegenkonto==='1000'&&(!bis||b.datum<=bis)).forEach(b=>{
    const k=konto(b.konto); if(!k)return; const v=Number(b.betrag)||0;
    s += (k.typ==='erloes'||k.nr==='1890')? v : -v; });
  return s; }

<script>
/* ==========================================================
   Datei-Import: Excel, CSV, JSON, Markdown-Tabelle
   ========================================================== */
let IMP={step:0,head:[],rows:[],map:{},file:'',kand:[]};

const STDREGELN=[
 ['sumup,kartenumsatz,kartenzahlung','1360'],['bareinzahlung,tageskasse,einzahlung','1360'],
 ['großhandel,grosshandel,süßwaren,suesswaren,wareneingang,lieferant','3300'],
 ['stadtwerke,strom,gas,wasser,energie','4240'],['miete,mietverwaltung,pacht','4210'],
 ['lohn,gehalt,minijob','4100'],['versicherung','4360'],['telekom,vodafone,internet,telefon','4920'],
 ['steuerberat,buchführung','4955'],['werbung,anzeige,google,meta','4600'],
 ['gebühr,entgelt,kontoführung','4970']
].map(r=>({id:uid(),wort:r[0],konto:r[1]}));

function stdRegeln(){ M().regeln=JSON.parse(JSON.stringify(STDREGELN)); save(); render(); toast('Regeln geladen') }

function pDatum(v){
  if(v==null||v==='') return '';
  if(typeof v==='number'&&v>20000&&v<60000){ const d=new Date(Date.UTC(1899,11,30+v)); return d.toISOString().slice(0,10) }
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
  if(m){ let y=m[3].length===2?'20'+m[3]:m[3]; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0') }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return '';
}
function pSatz(v){ const n=num(v); if(n>=15) return 19; if(n>=5) return 7; return 0 }

function guess(head){
  const P={datum:/datum|buchungstag|date|tag$|wertstell/i, belegnr:/beleg|bon|rechnungsnr|dokument|^nr$|_id/i,
    text:/verwendung|zweck|text|artikel|beschreib|description|bezeichnung/i,
    text2:/empf|auftraggeber|name|kassierer|kategorie|payee/i,
    betrag:/betrag|gesamt|summe|amount|brutto|wert$|preis/i, ust:/mwst|ust|steuer|tax|vat/i,
    konto:/konto|account/i, zahlart:/zahlart|zahlung|payment/i};
  const m={};
  Object.entries(P).forEach(([k,rx])=>{ const i=head.findIndex(h=>rx.test(String(h))); if(i>=0)m[k]=String(i) });
  return m;
}
function delimOf(txt){ const l=txt.split(/\r?\n/).find(x=>x.trim())||'';
  const c={';':(l.match(/;/g)||[]).length,'\t':(l.match(/\t/g)||[]).length,',':(l.match(/,/g)||[]).length};
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0] }
function splitCSV(line,d){ const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++} else q=!q }
    else if(c===d&&!q){out.push(cur);cur=''} else cur+=c }
  out.push(cur); return out.map(x=>x.trim()) }

function leseDatei(inp){
  const f=inp.files[0]; if(!f) return;
  IMP.file=f.name; const ext=(f.name.split('.').pop()||'').toLowerCase();
  const fertig=(head,rows)=>{ IMP.head=head.map(h=>String(h||'').trim()); IMP.rows=rows.filter(r=>r.some(c=>c!==''&&c!=null));
    IMP.map=guess(IMP.head); IMP.step=1; render(); };
  if(ext==='xlsx'||ext==='xls'){
    const r=new FileReader();
    r.onload=e=>{ try{ const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const sh=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:''});
      fertig(aoa[0]||[],aoa.slice(1)); }catch(err){toast('Datei nicht lesbar')} };
    r.readAsArrayBuffer(f); return;
  }
  const r=new FileReader();
  r.onload=e=>{ const txt=e.target.result;
    try{
      if(ext==='json'){ const j=JSON.parse(txt); const arr=Array.isArray(j)?j:(j.buchungen||[]);
        const head=Object.keys(arr[0]||{}); fertig(head,arr.map(o=>head.map(h=>o[h]))); return }
      if(ext==='md'||ext==='markdown'){
        const zeilen=txt.split(/\r?\n/).filter(z=>z.includes('|'));
        const zell=z=>z.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
        const head=zell(zeilen[0]);
        const rows=zeilen.slice(1).filter(z=>!/^[\s|:-]+$/.test(z)).map(zell);
        fertig(head,rows); return }
      const d=delimOf(txt);
      const zeilen=txt.split(/\r?\n/).filter(z=>z.trim());
      fertig(splitCSV(zeilen[0],d),zeilen.slice(1).map(z=>splitCSV(z,d)));
    }catch(err){ toast('Datei nicht lesbar') } };
  r.readAsText(f,'utf-8');
}

function regelKonto(text,vorz){
  const s=(text||'').toLowerCase();
  for(const r of (M().regeln||[])){
    if(r.wort.split(',').some(w=>w.trim()&&s.includes(w.trim().toLowerCase()))) return r.konto;
  }
  return vorz>=0?'8300':'4980';
}
function baueKandidaten(){
  const g=k=>IMP.map[k]!==undefined&&IMP.map[k]!==''?+IMP.map[k]:-1;
  const c={datum:g('datum'),beleg:g('belegnr'),text:g('text'),text2:g('text2'),betrag:g('betrag'),ust:g('ust'),zahlart:g('zahlart')};
  IMP.kand=IMP.rows.map(r=>{
    const txt=[c.text2>=0?r[c.text2]:'',c.text>=0?r[c.text]:''].filter(x=>String(x||'').trim()).join(' – ');
    const betrag=num(c.betrag>=0?r[c.betrag]:0);
    const datum=pDatum(c.datum>=0?r[c.datum]:'');
    const kn=regelKonto(txt,betrag);
    const k=konto(kn);
    const za=String(c.zahlart>=0?r[c.zahlart]:'').toLowerCase();
    const gegen=/bar|cash|kasse/.test(za)?'1000':(/karte|ec|sumup|card/.test(za)?'1210':'1200');
    const dup=M().buchungen.some(b=>b.datum===datum&&Math.abs(Math.abs(b.betrag)-Math.abs(betrag))<0.005&&b.text===txt);
    return {an:!dup&&!!datum&&!!betrag, datum, belegnr:String(c.beleg>=0?r[c.beleg]:'').trim(), text:txt,
      betrag:Math.abs(betrag), vorz:betrag<0?-1:1, konto:kn, gegenkonto:gegen,
      ust:c.ust>=0?pSatz(r[c.ust]):(k?k.ust:0), dup};
  });
  IMP.step=2; render();
}
function setK(i,v){ IMP.kand[i].konto=v; const k=konto(v); if(k)IMP.kand[i].ust=k.ust; render() }
function setG(i,v){ IMP.kand[i].gegenkonto=v }
function setAn(i,v){ IMP.kand[i].an=v }
function uebernehmen(){
  const ok=IMP.kand.filter(k=>k.an);
  if(!ok.length){toast('Nichts ausgewählt');return}
  ok.forEach(k=>M().buchungen.push({id:uid(),datum:k.datum,belegnr:k.belegnr,text:k.text,
    konto:k.konto,gegenkonto:k.gegenkonto,betrag:k.betrag,ust:k.ust,kst:''}));
  save(); IMP={step:0,head:[],rows:[],map:{},file:'',kand:[]};
  TAB='buchungen'; renderNav(); render(); toast(ok.length+' Buchungen übernommen');
}
function impReset(){ IMP={step:0,head:[],rows:[],map:{},file:'',kand:[]}; render() }

function regelForm(id){ const r=id?M().regeln.find(x=>x.id===id):{wort:'',konto:'4980'};
  openModal(id?'Regel bearbeiten':'Regel anlegen',`
   <div class="row"><div><label class="f">Stichwörter, mit Komma getrennt</label>
     <input id="r_w" value="${esc(r.wort)}" placeholder="stadtwerke, strom, gas"></div></div>
   <div class="row" style="margin-top:12px"><div><label class="f">Konto</label>
     <select id="r_k">${kOpt(r.konto,['erloes','aufwand','privat','finanz'])}</select></div></div>
   <div class="row" style="margin-top:20px;justify-content:flex-end">
     <button class="btn ghost fit" onclick="closeModal()">${t('cancel')}</button>
     <button class="btn fit" onclick="saveRegel('${id||''}')">${t('save')}</button></div>`) }
function saveRegel(id){ const o={wort:$('#r_w').value.trim().toLowerCase(),konto:$('#r_k').value};
  if(!o.wort){toast('Stichwort fehlt');return}
  M().regeln=M().regeln||[];
  if(id){Object.assign(M().regeln.find(x=>x.id===id),o)}else{M().regeln.push({id:uid(),...o})}
  save();closeModal();render() }
function delRegel(id){ M().regeln=M().regeln.filter(r=>r.id!==id);save();render() }

function expBuchungenCSV(){
  const rows=[['Datum','Beleg','Text','Konto','Kontobezeichnung','Gegenkonto','Brutto','USt-Satz','Netto']];
  M().buchungen.slice().sort((a,b)=>a.datum.localeCompare(b.datum)).forEach(b=>{ const s=split(b),k=konto(b.konto)||{};
    rows.push([dDE(b.datum),b.belegnr||'',b.text,b.konto,k.name||'',b.gegenkonto,
      eur(s.brutto),s.satz+'%',eur(s.netto)]) });
  const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='buchungen-'+M().name.replace(/\W+/g,'-').toLowerCase()+'.csv'; a.click(); toast('CSV erstellt');
}
