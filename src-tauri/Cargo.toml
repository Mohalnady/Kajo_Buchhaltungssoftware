[package]
name = "app"
version = "0.1.0"
description = "Buchhaltungs- und Abrechnungsprogramm für kleine Einzelhandelsbetriebe"
authors = ["Kontor"]
license = ""
repository = "https://github.com/Mohalnady/Kajo_Buchhaltungssoftware"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
webbrowser = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
